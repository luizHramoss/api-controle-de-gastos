services:
  - type: web
    name: finance-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "Finance API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: finance-api-db
          property: connectionString
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "localhost:5173"
      - key: SEED_DB
        value: "true"

databases:
  - name: finance-api-db
    plan: free
    databaseName: finance_api
    user: finance_user
